<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanderlust - AI Travel Planner</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Background Elements -->
    <div class="bg-overlay"></div>
    <div class="floating-elements">
        <i class="fas fa-plane floating-icon icon-1"></i>
        <i class="fas fa-globe-americas floating-icon icon-2"></i>
        <i class="fas fa-map-marked-alt floating-icon icon-3"></i>
        <i class="fas fa-suitcase-rolling floating-icon icon-4"></i>
        <i class="fas fa-passport floating-icon icon-5"></i>
    </div>
    
    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo">
                <i class="fas fa-compass"></i>
            </div>
            <h1>Wanderlust</h1>
            <p>Your AI-Powered Travel Companion</p>
        </header>
        
        <!-- Search Section -->
        <div class="search-section">
            <div class="search-card">
                <h2><i class="fas fa-search-location"></i> Where do you want to explore?</h2>
                <div class="search-input-wrapper">
                    <i class="fas fa-map-pin input-icon"></i>
                    <input type="text" id="queryInput" placeholder="Enter a destination... (e.g., Paris, Tokyo, New York)">
                    <button id="searchBtn" onclick="processQuery()">
                        <i class="fas fa-paper-plane"></i>
                        <span>Explore</span>
                    </button>
                </div>
                <div class="search-suggestions">
                    <span class="suggestion" onclick="setQuery('Paris')"><i class="fas fa-landmark"></i> Paris</span>
                    <span class="suggestion" onclick="setQuery('Tokyo')"><i class="fas fa-torii-gate"></i> Tokyo</span>
                    <span class="suggestion" onclick="setQuery('New York')"><i class="fas fa-city"></i> New York</span>
                    <span class="suggestion" onclick="setQuery('Dubai')"><i class="fas fa-mosque"></i> Dubai</span>
                    <span class="suggestion" onclick="setQuery('Bali')"><i class="fas fa-umbrella-beach"></i> Bali</span>
                </div>
            </div>
        </div>
        
        <!-- Loading Indicator -->
        <div class="loading-indicator" id="loadingIndicator">
            <div class="loader">
                <i class="fas fa-plane"></i>
            </div>
            <p>Discovering amazing places for you...</p>
        </div>
        
        <!-- Results -->
        <div class="results" id="results"></div>
        
        <!-- Place Details Modal -->
        <div class="modal" id="placeModal">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="modal-title-wrapper">
                        <i class="fas fa-map-marker-alt"></i>
                        <h2 id="modalTitle">Place Name</h2>
                    </div>
                    <button class="close-btn" onclick="closeModal()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <!-- Google Maps Buttons -->
                    <div class="maps-section">
                        <h3><i class="fas fa-route"></i> Explore & Navigate</h3>
                        <div class="maps-buttons">
                            <a id="viewMapBtn" href="#" target="_blank" class="map-btn view-btn">
                                <i class="fas fa-map"></i>
                                <span>View on Map</span>
                            </a>
                            <a id="directionsBtn" href="#" target="_blank" class="map-btn directions-btn">
                                <i class="fas fa-directions"></i>
                                <span>Get Directions</span>
                            </a>
                            <a id="nearbyBtn" href="#" target="_blank" class="map-btn nearby-btn">
                                <i class="fas fa-utensils"></i>
                                <span>Restaurants</span>
                            </a>
                            <a id="hotelsBtn" href="#" target="_blank" class="map-btn hotels-btn">
                                <i class="fas fa-bed"></i>
                                <span>Hotels</span>
                            </a>
                        </div>
                    </div>
                    
                    <!-- Embedded Map Preview -->
                    <div class="map-preview-section">
                        <div id="mapPreview" class="map-preview">
                            <iframe id="mapFrame" src="" frameborder="0" allowfullscreen></iframe>
                        </div>
                    </div>
                    
                    <!-- Photos Section -->
                    <div class="photos-section">
                        <h3><i class="fas fa-camera-retro"></i> Photos</h3>
                        <div id="photosContainer" class="photos-grid">
                            <div class="photos-loading">
                                <div class="spinner"></div>
                                <p>Loading photos...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Footer -->
        <footer>
            <p>Made with <i class="fas fa-heart"></i> for travelers worldwide</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
